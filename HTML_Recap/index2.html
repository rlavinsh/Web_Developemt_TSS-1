<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table Design</title>
  </head>
  <body>
    <table border="2">
      <thead>
        <tr>
          <th rowspan="2">Department</th>
          <th colspan="3">Employee Details</th>
        </tr>
        <!-- 2nd Row -->
        <tr>
          <th>Name</th>
          <th>Position</th>
          <th>Salary</th>
        </tr>
      </thead>
      <!-- 3rd row -->
      <tbody>
        <tr>
          <td rowspan="2">Development</td>
          <td>Amit</td>
          <td>Frontend Developer</td>
          <td>50000</td>
        </tr>
        <!-- 4th Row -->
        <tr>
          <td>Neha</td>
          <td>Backend Developer</td>
          <td>60000</td>
        </tr>
      </tbody>
      <!-- 5th Row -->
      <tfoot>
        <tr>
          <th colspan="3">Total Employees</th>
          <td>2</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
